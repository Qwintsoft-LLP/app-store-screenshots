services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-store-screenshots
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PROJECT_STATE_PATH=/app/storage/app-store-screenshots.json
    volumes:
      - screenshots_uploads:/app/public/screenshots/uploaded
      - fonts_uploads:/app/public/fonts/imported
      - project_storage:/app/storage
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  screenshots_uploads:
    name: app-store-screenshots_uploads
  fonts_uploads:
    name: app-store-screenshots_fonts
  project_storage:
    name: app-store-screenshots_storage
